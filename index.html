<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AFIDAMP Market Map (Pilota)</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 16px; }
    .row { display: flex; gap: 12px; flex-wrap: wrap; }
    .card { border: 1px solid #ddd; border-radius: 10px; padding: 12px; min-width: 260px; }
    .kpi { font-size: 22px; font-weight: bold; }

    .badge { display:inline-block; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: bold; margin-top: 8px; }
    .badge-prio { background: #ffe8e8; border: 1px solid #ffb3b3; }
    .badge-sel  { background: #fff4db; border: 1px solid #ffd27a; }
    .badge-mon  { background: #e9f2ff; border: 1px solid #b9d7ff; }
    .small { color:#555; font-size: 12px; margin-top: 6px; }

    details summary { cursor: pointer; }
    details p { margin: 8px 0; }

    label { display:block; margin-bottom: 6px; }
    select, button { padding: 8px; }
  </style>
</head>
<body>
  <h2>AFIDAMP Market Map – Tool Pilota</h2>

  <div class="row">
    <div class="card">
      <label>Settore</label>
      <select id="sector">
        <option value="SCHOOL">Scuole</option>
        <option value="HEALTH">Sanità</option>
      </select>
    </div>

    <div class="card">
      <label>Territorio (Regione)</label>
      <select id="region"></select>
    </div>

    <div class="card">
      <label>&nbsp;</label>
      <button id="run">Calcola</button>
    </div>
  </div>

  <h3>Risultati</h3>
  <div id="out" class="row"></div>

<script>
const SUPABASE_URL = "https://buktyetguurbtxxmtmzl.supabase.co";
const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ1a3R5ZXRndXVyYnR4eG10bXpsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjU5NzEzMjMsImV4cCI6MjA4MTU0NzMyM30.AhqtRyFhQhJEu9ovuFTnoIjQyf0A2hYj54hV_O931tg";

async function sb(path) {
  const res = await fetch(SUPABASE_URL + "/rest/v1/" + path, {
    headers: {
      "apikey": SUPABASE_ANON,
      "Authorization": "Bearer " + SUPABASE_ANON
    }
  });
  if (!res.ok) {
    const txt = await res.text();
    throw new Error(`Supabase error (${res.status}): ${txt}`);
  }
  return res.json();
}

function assertNonEmpty(arr, message) {
  if (!arr || !Array.isArray(arr) || arr.length === 0) throw new Error(message);
  return arr;
}
function assertValue(v, message) {
  if (v === undefined || v === null || v === "") throw new Error(message);
  return v;
}
function num(v, message) {
  if (v === undefined || v === null || v === "") throw new Error(message);
  const n = Number(v);
  if (Number.isNaN(n)) throw new Error(`${message} (valore="${v}")`);
  return n;
}

function opportunityClass(value, lowMax, mediumMax) {
  if (value <= lowMax) return "Bassa";
  if (value <= mediumMax) return "Media";
  return "Alta";
}

function opportunityBadge(opportunity) {
  if (opportunity === "Alta") return { label: "Prioritario", cls: "badge badge-prio" };
  if (opportunity === "Media") return { label: "Selettivo", cls: "badge badge-sel" };
  return { label: "Monitorare", cls: "badge badge-mon" };
}

function opportunityMessages(level) {
  if (level === "Alta") {
    return {
      title: "Territorio prioritario",
      text: `
        Il livello di opportunità <strong>ALTA</strong> indica un contesto con elevata concentrazione
        di superfici e requisiti operativi complessi.
        È un territorio su cui concentrare investimenti, presenza commerciale e soluzioni dedicate.
      `,
      actions: `
        <ul>
          <li><strong>Imprese di servizi</strong>: strutturare presidi stabili e piani di controllo qualità avanzati.</li>
          <li><strong>Distributori</strong>: rafforzare assortimento, stock e supporto tecnico locale.</li>
          <li><strong>Fabbricanti</strong>: priorità a reti commerciali, key account e partnership territoriali.</li>
        </ul>
      `
    };
  }
  if (level === "Media") {
    return {
      title: "Territorio selettivo",
      text: `
        Il livello di opportunità <strong>MEDIA</strong> indica un mercato con potenziale,
        ma con forte eterogeneità tra strutture e tipologie.
      `,
      actions: `
        <ul>
          <li><strong>Imprese di servizi</strong>: differenziare livelli di servizio per tipologia.</li>
          <li><strong>Distributori</strong>: focalizzarsi sulle categorie a maggiore rotazione.</li>
          <li><strong>Fabbricanti</strong>: sviluppare casi pilota mirati.</li>
        </ul>
      `
    };
  }
  return {
    title: "Territorio da monitorare",
    text: `
      Il livello di opportunità <strong>BASSA</strong> indica un mercato limitato o frammentato.
    `,
    actions: `
      <ul>
        <li><strong>Imprese di servizi</strong>: ottimizzazione dei costi.</li>
        <li><strong>Distributori</strong>: presidio essenziale.</li>
        <li><strong>Fabbricanti</strong>: monitoraggio evoluzioni strutturali.</li>
      </ul>
    `
  };
}

async function loadRegions() {
  const regions = await sb("geo_area?level=eq.REGION&select=istat_code,name_it&order=name_it.asc");
  document.getElementById("region").innerHTML =
    regions.map(r => `<option value="${r.istat_code}">${r.name_it}</option>`).join("");
}

async function estimate(sectorCode, regionIstat) {
  const mv = await sb("model_version?status=eq.published&select=id,version_code,methodology_note&order=id.desc&limit=1");
  assertNonEmpty(mv, "Nessuna model_version pubblicata trovata.");
  const mvId = mv[0].id;
  const methodology = mv[0].methodology_note || "";

  const sector = await sb(`sector?code=eq.${sectorCode}&select=id`);
  const sectorId = sector[0].id;

  const geo = await sb(`geo_area?level=eq.REGION&istat_code=eq.${regionIstat}&select=id,name_it`);
  const geoId = geo[0].id;

  const thr = await sb(`opportunity_thresholds?model_version_id=eq.${mvId}&sector_id=eq.${sectorId}&geo_level=eq.REGION&metric=eq.surface_iic_weighted&select=low_max,medium_max`);
  const lowMax = num(thr[0].low_max, "low_max mancante");
  const mediumMax = num(thr[0].medium_max, "medium_max mancante");

  if (sectorCode === "SCHOOL") {
    const base = await sb(`market_base_data?sector_id=eq.${sectorId}&geo_area_id=eq.${geoId}&select=units_count,source_name,source_year&limit=1`);
    const coeff = await sb(`afidamp_coefficients?model_version_id=eq.${mvId}&sector_id=eq.${sectorId}&select=surface_per_unit,iic&limit=1`);

    const surface = base[0].units_count * coeff[0].surface_per_unit;
    const weighted = surface * (coeff[0].iic / 5);

    return {
      title: `Scuole – ${geo[0].name_it}`,
      unitsLabel: "Edifici scolastici",
      units: base[0].units_count,
      surface,
      weighted,
      opportunity: opportunityClass(weighted, lowMax, mediumMax),
      source: `${base[0].source_name} (${base[0].source_year})`,
      model: `AFIDAMP v${mv[0].version_code}`,
      modelVersionId: mvId,
      methodology
    };
  }

  const subtypes = await sb(`sector_subtype?sector_id=eq.${sectorId}&select=id,label_it`);
  const coeffs = await sb(`afidamp_coefficients?model_version_id=eq.${mvId}&sector_id=eq.${sectorId}&select=sector_subtype_id,surface_per_proxy_unit,iic`);

  let rows = [], totalSurface = 0, totalWeighted = 0;

  for (const st of subtypes) {
    const base = await sb(`market_base_data?sector_id=eq.${sectorId}&sector_subtype_id=eq.${st.id}&geo_area_id=eq.${geoId}&select=proxy_value&limit=1`);
    if (!base.length) continue;

    const c = coeffs.find(x => x.sector_subtype_id === st.id);
    if (!c) continue;

    const surface = base[0].proxy_value * c.surface_per_proxy_unit;
    totalSurface += surface;
    totalWeighted += surface * (c.iic / 5);

    rows.push({ subtype: st.label_it, beds: base[0].proxy_value, surface });
  }

  return {
    title: `Sanità – ${geo[0].name_it}`,
    detailRows: rows,
    surface: totalSurface,
    weighted: totalWeighted,
    opportunity: opportunityClass(totalWeighted, lowMax, mediumMax),
    model: `AFIDAMP v${mv[0].version_code}`,
    modelVersionId: mvId,
    methodology
  };
}

function fmt(n) {
  return new Intl.NumberFormat("it-IT").format(Math.round(n));
}

document.getElementById("run").addEventListener("click", async () => {
  const out = document.getElementById("out");
  out.innerHTML = "";
  try {
    const r = await estimate(
      document.getElementById("sector").value,
      document.getElementById("region").value
    );

    const badge = opportunityBadge(r.opportunity);
    const msg = opportunityMessages(r.opportunity);

    let html = `
      <div class="card" style="flex:1">
        <strong>${r.title}</strong>
        <div class="kpi">Opportunità: ${r.opportunity}</div>
        <div class="${badge.cls}">${badge.label}</div>
        <div class="small">Lettura operativa</div>
        <div>Superficie stimata: <strong>${fmt(r.surface)} m²</strong></div>
        <div>Superficie pesata (IIC): <strong>${fmt(r.weighted)} m²</strong></div>
        <div class="small">${r.model}</div>
      </div>

      <div class="card" style="background:#f7f7f7; flex:1">
        <strong>${msg.title}</strong>
        <p>${msg.text}</p>
        ${msg.actions}
      </div>
    `;

    if (r.unitsLabel) {
      html += `
        <div class="card">
          <strong>${r.unitsLabel}</strong>
          <div class="kpi">${fmt(r.units)}</div>
          <div class="small">Fonte: ${r.source}</div>
        </div>
      `;
    } else {
      const rows = r.detailRows
        .map(x => `<li>${x.subtype}: ${fmt(x.beds)} posti letto (stima) → ${fmt(x.surface)} m²</li>`)
        .join("");
      html += `
        <div class="card">
          <strong>Dettaglio</strong>
          <ul>${rows}</ul>
        </div>
      `;
    }

    html += `
      <div class="card">
        <details>
          <summary><strong>Nota metodologica AFIDAMP</strong></summary>
          <p>
            Le stime sono indicative e basate su dati strutturali disponibili.
            Nel settore Sanità, i <strong>posti letto (stima)</strong> sono utilizzati
            come indicatore di riferimento per stimare le superfici operative.
          </p>
          <p><strong>Versione modello:</strong> ${r.model} – ID ${r.modelVersionId}</p>
          ${r.methodology ? `<p>${r.methodology}</p>` : ""}
        </details>
      </div>
    `;

    out.innerHTML = html;
  } catch (e) {
    out.innerHTML = `<div class="card"><pre>${e.message}</pre></div>`;
  }
});

loadRegions();
</script>
</body>
</html>
